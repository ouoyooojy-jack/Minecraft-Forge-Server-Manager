[package]
name = "mc-server-manager"
version = "2.0.0"
description = "Minecraft Forge server manager"
edition = "2021"
rust-version = "1.77"

[lib]
# The binary is a thin shim over this; keeping the logic in a lib lets the
# core modules be unit-tested without launching a window.
#
# rlib only: staticlib and cdylib exist for the mobile targets, and building
# three copies of the crate to ship one Windows exe is time and disk for
# nothing. Add them back the day this targets Android or iOS.
name = "mc_server_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: closing the window hides the app instead of killing the servers
# it is supervising, so there has to be something left on screen to get back to.
tauri = { version = "2", features = ["tray-icon"] }
# Native folder picker for "import an existing server".
tauri-plugin-dialog = "2"
# In-app updates. default-features off drops the bundled rustls: the transfer
# goes over the system TLS stack, same as every other request this app makes,
# rather than shipping a second one.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "native-tls",
    "zip",
] }
# Only for the relaunch after an update installs.
tauri-plugin-process = "2"
# With the app living in the tray, launching it again must raise the window
# that is already there. A second process would supervise its own copy of every
# server and fight the first one for the ports.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "fs",
    "net",
] }

# default-features off drops the blocking client, cookies, gzip, and charset
# machinery none of this needs. native-tls means schannel on Windows — the
# system's TLS, rather than bundling rustls plus a root store into the exe.
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }

# Challenge-response for the remote-access listener: the pairing code is never
# sent over the wire, only an HMAC of the server's nonce. Both are tiny and
# pure Rust — no C, no second crypto stack.
sha2 = "0.10"
hmac = "0.12"
# Nonces and pairing codes. The OS generator, not a seeded PRNG.
getrandom = "0.3"

# Unpacking the JRE archive Adoptium ships. deflate only — no bzip2/zstd/aes,
# none of which a JDK zip uses, all of which are weight in the exe.
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
# A job object, so the playit agent dies with the app however the app dies.
# Already in the tree through tokio and friends; this only names it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Smallest binary that still panics usefully. Tauri's own recommendation.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
